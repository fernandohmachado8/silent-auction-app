name: Deploy Frontend To Firebase Hosting

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Firebase Hosting
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || vars.REACT_APP_API_URL }}
      REACT_APP_ADMIN_EMAIL: ${{ secrets.REACT_APP_ADMIN_EMAIL || vars.REACT_APP_ADMIN_EMAIL }}
      REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY || vars.REACT_APP_FIREBASE_API_KEY }}
      REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN || vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
      REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID || vars.REACT_APP_FIREBASE_PROJECT_ID }}
      REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET || vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID || vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
      REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID || vars.REACT_APP_FIREBASE_APP_ID }}
      GENERATE_SOURCEMAP: "false"
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Validate production configuration
        shell: bash
        env:
          FIREBASE_DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SILENTAUCTIONAPP_4CA96 || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in FIREBASE_DEPLOY_CREDENTIAL REACT_APP_API_URL REACT_APP_ADMIN_EMAIL REACT_APP_FIREBASE_API_KEY REACT_APP_FIREBASE_AUTH_DOMAIN REACT_APP_FIREBASE_PROJECT_ID REACT_APP_FIREBASE_STORAGE_BUCKET REACT_APP_FIREBASE_MESSAGING_SENDER_ID REACT_APP_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              printf '::error::Missing production setting: %s\n' "$name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Record deployed source commit
        run: |
          node -e 'const fs = require("node:fs"); const cp = require("node:child_process"); fs.writeFileSync("build/build-info.json", JSON.stringify({ commit: cp.execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim() }) + "\n");'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SILENTAUCTIONAPP_4CA96 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: silentauctionapp-4ca96
          channelId: live

      - name: Verify live source commit
        run: |
          node -e 'const cp = require("node:child_process"); const expected = cp.execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(); (async () => { for (let attempt = 0; attempt < 6; attempt++) { try { const response = await fetch("https://silentauctionapp-4ca96.web.app/build-info.json?commit=" + expected, { signal: AbortSignal.timeout(15000) }); if (response.ok && (await response.json()).commit === expected) { console.log("Verified live source commit: " + expected); return; } } catch {} await new Promise(resolve => setTimeout(resolve, 5000)); } throw new Error("Live Firebase build does not match the deployed source commit"); })().catch(error => { console.error(error.message); process.exit(1); });'
